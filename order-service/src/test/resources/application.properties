spring.application.name=order-service

spring.datasource.url=jdbc:h2:mem:testdb-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS orders
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=orders

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.default-schema=orders
spring.liquibase.liquibase-schema=orders

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

app.kafka.topics.order-placed=order-placed
app.kafka.topics.order-cancelled=order-cancelled

spring.cloud.openfeign.client.config.cart-service.url=${wiremock.server.baseUrl:http://localhost:8083}
spring.cloud.openfeign.client.config.inventory-service.url=${wiremock.server.baseUrl:http://localhost:8082}

logging.level.root=INFO
logging.level.pl.shop=DEBUG
