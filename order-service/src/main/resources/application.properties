server.port=${SERVER_PORT:8084}

spring.application.name=order-service

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shop}?currentSchema=orders
spring.datasource.username=${DB_USERNAME:shop}
spring.datasource.password=${DB_PASSWORD:shop}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=orders
spring.jpa.properties.hibernate.default_batch_fetch_size=50

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.default-schema=orders
spring.liquibase.liquibase-schema=orders

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.type.mapping=orderPlaced:pl.shop.order.kafka.event.OrderPlacedEvent,orderCancelled:pl.shop.order.kafka.event.OrderCancelledEvent

app.kafka.topics.order-placed=order-placed
app.kafka.topics.order-cancelled=order-cancelled

spring.cloud.openfeign.client.config.cart-service.url=${CART_SERVICE_URL:http://localhost:8083}
spring.cloud.openfeign.client.config.inventory-service.url=${INVENTORY_SERVICE_URL:http://localhost:8082}
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=5000

management.endpoints.web.exposure.include=health,info

logging.level.root=INFO
logging.level.pl.shop=DEBUG
