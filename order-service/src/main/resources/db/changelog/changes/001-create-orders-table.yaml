databaseChangeLog:
  - changeSet:
      id: 1
      author: w1kt0r
      changes:
        - createTable:
            tableName: orders
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_orders
                    nullable: false
              - column:
                  name: order_number
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_orders_order_number
              - column:
                  name: cart_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_orders_cart_id
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: customer_first_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: customer_last_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: customer_email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: shipping_street
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: shipping_city
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: shipping_postal_code
                  type: VARCHAR(6)
                  constraints:
                    nullable: false
              - column:
                  name: shipping_country
                  type: VARCHAR(2)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: cancelled_at
                  type: TIMESTAMP
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - sql:
            dbms: postgresql
            sql: ALTER TABLE orders ADD CONSTRAINT chk_orders_status CHECK (status IN ('PLACED', 'CANCELLED'))