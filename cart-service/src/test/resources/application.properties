spring.application.name=cart-service

spring.datasource.url=jdbc:h2:mem:testdb-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS cart
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=cart

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.default-schema=cart
spring.liquibase.liquibase-schema=cart

spring.cloud.openfeign.client.config.product-service.url=${wiremock.server.baseUrl:http://localhost:8081}
spring.cloud.openfeign.client.config.inventory-service.url=${wiremock.server.baseUrl:http://localhost:8082}

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.listener.auto-startup=false
spring.kafka.consumer.group-id=cart-service-test

app.kafka.topics.order-placed=order-placed

logging.level.root=INFO
logging.level.pl.shop=DEBUG
