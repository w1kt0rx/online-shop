server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: cart-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shop}?currentSchema=cart
    username: ${DB_USERNAME:shop}
    password: ${DB_PASSWORD:shop}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: cart

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: cart
    liquibase-schema: cart

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: cart-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "pl.shop.*"
        spring.json.type.mapping: orderPlaced:pl.shop.cart.kafka.event.OrderPlacedEvent

  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000
            logger-level: basic

app:
  kafka:
    topics:
      product-created: product-created
      order-placed: order-placed
  clients:
    product-service:
      url: ${PRODUCT_SERVICE_URL:http://localhost:8081}
    inventory-service:
      url: ${INVENTORY_SERVICE_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    pl.shop: DEBUG
    pl.shop.cart.client: DEBUG
