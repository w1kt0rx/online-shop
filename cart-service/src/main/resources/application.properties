server.port=${SERVER_PORT:8083}

spring.application.name=cart-service

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shop}?currentSchema=cart
spring.datasource.username=${DB_USERNAME:shop}
spring.datasource.password=${DB_PASSWORD:shop}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=cart
spring.jpa.properties.hibernate.default_batch_fetch_size=50

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.default-schema=cart
spring.liquibase.liquibase-schema=cart

spring.cloud.openfeign.client.config.product-service.url=${PRODUCT_SERVICE_URL:http://localhost:8081}
spring.cloud.openfeign.client.config.inventory-service.url=${INVENTORY_SERVICE_URL:http://localhost:8082}
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=5000

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=cart-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=pl.shop.*
spring.kafka.consumer.properties.spring.json.type.mapping=orderPlaced:pl.shop.cart.kafka.event.OrderPlacedEvent
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

app.kafka.topics.order-placed=order-placed

management.endpoints.web.exposure.include=health,info

logging.level.root=INFO
logging.level.pl.shop=DEBUG
