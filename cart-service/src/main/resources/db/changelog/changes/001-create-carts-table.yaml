databaseChangeLog:
  - changeSet:
      id: 1
      author: w1kt0r
      changes:
        - createTable:
            tableName: carts
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_carts
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
        - sql:
            dbms: postgresql
            sql: ALTER TABLE carts ADD CONSTRAINT chk_carts_status CHECK (status IN ('ACTIVE', 'ORDERED'))