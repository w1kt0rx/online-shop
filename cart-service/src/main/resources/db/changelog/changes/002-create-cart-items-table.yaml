databaseChangeLog:
  - changeSet:
      id: 2
      author: w1kt0r
      changes:
        - createTable:
            tableName: cart_items
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_cart_items
                    nullable: false
              - column:
                  name: cart_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_cart_items_cart
                    references: carts(id)
                    deleteCascade: true
              - column:
                  name: product_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: product_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: net_price
                  type: NUMERIC(12, 2)
                  constraints:
                    nullable: false
              - column:
                  name: vat_rate
                  type: NUMERIC(4, 2)
                  constraints:
                    nullable: false
              - column:
                  name: currency
                  type: VARCHAR(3)
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: INT
                  constraints:
                    nullable: false
        - sql:
            dbms: postgresql
            sql: ALTER TABLE cart_items ADD CONSTRAINT chk_cart_items_quantity CHECK (quantity BETWEEN 1 AND 99)