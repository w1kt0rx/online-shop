# Server configuration
server.port=${SERVER_PORT:8082}

# Spring Application configuration
spring.application.name=inventory-service

# Datasource configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shop}?currentSchema=inventory
spring.datasource.username=${DB_USERNAME:shop}
spring.datasource.password=${DB_PASSWORD:shop}

# JPA & Hibernate configuration
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=inventory

# Liquibase configuration
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.default-schema=inventory
spring.liquibase.liquibase-schema=inventory

# Kafka configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=inventory-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=pl.shop.*
spring.kafka.consumer.properties.spring.json.type.mapping=productCreated:pl.shop.inventory.kafka.event.ProductCreatedEvent

# Custom Application topics
app.kafka.topics.product-created=product-created
app.kafka.topics.order-placed=order-placed

# Actuator / Management endpoints
management.endpoints.web.exposure.include=health,info

# Logging configuration
logging.level.root=INFO
logging.level.pl.shop=DEBUG