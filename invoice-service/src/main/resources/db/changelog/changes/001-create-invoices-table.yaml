databaseChangeLog:
  - changeSet:
      id: 1
      author: w1kt0r
      changes:
        - createTable:
            tableName: invoices
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_invoices
                    nullable: false
              - column:
                  name: invoice_number
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_invoices_invoice_number
              - column:
                  name: order_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_invoices_order_id
              - column:
                  name: order_number
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: buyer_first_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: buyer_last_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: buyer_email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: billing_street
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: billing_city
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: billing_postal_code
                  type: VARCHAR(6)
                  constraints:
                    nullable: false
              - column:
                  name: billing_country
                  type: VARCHAR(2)
                  constraints:
                    nullable: false
              - column:
                  name: currency
                  type: VARCHAR(3)
                  constraints:
                    nullable: false
              - column:
                  name: issued_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: cancelled_at
                  type: TIMESTAMP
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - createIndex:
            tableName: invoices
            indexName: idx_invoices_buyer_email
            columns:
              - column:
                  name: buyer_email
        - createIndex:
            tableName: invoices
            indexName: idx_invoices_issued_at
            columns:
              - column:
                  name: issued_at
        - sql:
            dbms: postgresql
            sql: ALTER TABLE invoices ADD CONSTRAINT chk_invoices_status CHECK (status IN ('ISSUED', 'CANCELLED'))
