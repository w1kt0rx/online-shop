databaseChangeLog:
  - changeSet:
      id: 2
      author: w1kt0r
      changes:
        - createTable:
            tableName: invoice_lines
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_invoice_lines
                    nullable: false
              - column:
                  name: invoice_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_invoice_lines_invoice
                    references: invoices(id)
                    deleteCascade: true
              - column:
                  name: product_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(1000)
              - column:
                  name: quantity
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: unit_net_price
                  type: NUMERIC(12, 2)
                  constraints:
                    nullable: false
              - column:
                  name: vat_rate
                  type: NUMERIC(4, 2)
                  constraints:
                    nullable: false
        - createIndex:
            tableName: invoice_lines
            indexName: idx_invoice_lines_invoice_id
            columns:
              - column:
                  name: invoice_id
        - sql:
            dbms: postgresql
            sql: ALTER TABLE invoice_lines ADD CONSTRAINT chk_invoice_lines_quantity CHECK (quantity >= 1)
