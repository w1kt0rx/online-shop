server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: invoice-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shop}?currentSchema=invoice
    username: ${DB_USERNAME:shop}
    password: ${DB_PASSWORD:shop}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: invoice

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: invoice
    liquibase-schema: invoice

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: invoice-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "pl.shop.*"
        spring.json.type.mapping: orderPlaced:pl.shop.invoice.kafka.event.OrderPlacedEvent

app:
  kafka:
    topics:
      product-created: product-created
      order-placed: order-placed

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    pl.shop: DEBUG
