server.port=${SERVER_PORT:8085}

spring.application.name=invoice-service

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shop}?currentSchema=invoice
spring.datasource.username=${DB_USERNAME:shop}
spring.datasource.password=${DB_PASSWORD:shop}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=invoice
spring.jpa.properties.hibernate.default_batch_fetch_size=50

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.default-schema=invoice
spring.liquibase.liquibase-schema=invoice

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=invoice-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=pl.shop.*
spring.kafka.consumer.properties.spring.json.type.mapping=orderPlaced:pl.shop.invoice.kafka.event.OrderPlacedEvent,orderCancelled:pl.shop.invoice.kafka.event.OrderCancelledEvent
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

app.kafka.topics.order-placed=order-placed
app.kafka.topics.order-cancelled=order-cancelled

management.endpoints.web.exposure.include=health,info

logging.level.root=INFO
logging.level.pl.shop=DEBUG
