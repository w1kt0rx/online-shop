# Server
server.port=${SERVER_PORT:8081}

# Application
spring.application.name=product-service

# Datasource
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shop}?currentSchema=product
spring.datasource.username=${DB_USERNAME:shop}
spring.datasource.password=${DB_PASSWORD:shop}

# JPA & Hibernate
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=product
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.default-schema=product
spring.liquibase.liquibase-schema=product

# Kafka - producer (Spring Boot sam tworzy z tego KafkaTemplate)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.type.mapping=productCreated:pl.shop.product.kafka.event.ProductCreatedEvent

# Topics
app.kafka.topics.product-created=product-created

# Actuator
management.endpoints.web.exposure.include=health,info

# Logging
logging.level.root=INFO
logging.level.pl.shop=DEBUG