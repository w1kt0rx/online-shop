server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: product-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shop}?currentSchema=product
    username: ${DB_USERNAME:shop}
    password: ${DB_PASSWORD:shop}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: product

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: product
    liquibase-schema: product

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: productCreated:pl.shop.product.kafka.event.ProductCreatedEvent

app:
  kafka:
    topics:
      product-created: product-created
      order-placed: order-placed

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    pl.shop: DEBUG

