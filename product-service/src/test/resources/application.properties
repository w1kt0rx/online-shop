# Spring Application configuration
spring.application.name=product-service

# Datasource configuration
spring.datasource.url=jdbc:h2:mem:testdb-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS product
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA & Hibernate configuration
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=product

# Liquibase configuration
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.default-schema=product
spring.liquibase.liquibase-schema=product

# Custom Application topics
app.kafka.topics.product-created=product-created
app.kafka.topics.order-placed=order-placed

# Logging configuration
logging.level.root=INFO
logging.level.pl.shop=DEBUG