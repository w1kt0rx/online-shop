server.port=${SERVER_PORT:8080}

spring.application.name=user-interaction-service

spring.cloud.openfeign.httpclient.hc5.enabled=true
spring.cloud.openfeign.client.config.product-service.url=${PRODUCT_SERVICE_URL:http://localhost:8081}
spring.cloud.openfeign.client.config.inventory-service.url=${INVENTORY_SERVICE_URL:http://localhost:8082}
spring.cloud.openfeign.client.config.cart-service.url=${CART_SERVICE_URL:http://localhost:8083}
spring.cloud.openfeign.client.config.order-service.url=${ORDER_SERVICE_URL:http://localhost:8084}
spring.cloud.openfeign.client.config.invoice-service.url=${INVOICE_SERVICE_URL:http://localhost:8085}
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=10000

management.endpoints.web.exposure.include=health,info

logging.level.root=INFO
logging.level.pl.shop=DEBUG
